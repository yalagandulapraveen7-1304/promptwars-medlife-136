<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedLens — Clinical Intelligence Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#006194',
              600: '#00527e',
              700: '#004368'
            },
            secondary: {
              500: '#006a61',
              600: '#00564e'
            },
            surface: '#f8f9ff'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    /* Dropdown transitions */
    .dropdown-menu {
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: all 0.12s ease-out;
      pointer-events: none;
    }
    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu,
    .dropdown-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }
    /* Strictly eliminate any scrolling or scrollbars in the navbar */
    header nav, header nav * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    header nav::-webkit-scrollbar, header nav *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    /* Custom scrollbar for directory overview and doc preview only */
    #directory-view::-webkit-scrollbar, main::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    #directory-view::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    #directory-view::-webkit-scrollbar-thumb:hover, main::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 font-sans antialiased flex flex-col overflow-hidden">

  <!-- TOP PRIMARY NAVIGATION BAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs flex-none">
    <div class="w-full px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between gap-4">

      <!-- Brand Logo (Left) -->
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary-600 to-teal-600 flex items-center justify-center text-white shadow-sm">
          <span class="material-symbols-outlined text-lg">vital_signs</span>
        </div>
        <a href="javascript:void(0)" onclick="loadScreen('dashboard-desktop')" class="flex items-center gap-2 group">
          <span class="font-heading font-bold text-base text-slate-900 tracking-tight group-hover:text-primary-600 transition-colors">MedLens</span>
          <span class="hidden sm:inline-block text-[10px] font-semibold uppercase tracking-wider bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">Suite</span>
        </a>
      </div>

      <!-- Navigation Options: Clean, simplified 4-option bar spread over defined limit, strictly no scrolling -->
      <nav class="flex-1 max-w-xl lg:max-w-2xl mx-auto flex items-center justify-between sm:justify-around text-xs sm:text-sm font-medium">

        <!-- 1. Doctor Dashboard (Direct Link) -->
        <button onclick="loadScreen('dashboard-desktop')" class="nav-trigger nav-direct flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 hover:text-primary-600 hover:bg-slate-50 transition-colors" id="nav-btn-dashboards" data-screen-id="dashboard-desktop">
          <span class="material-symbols-outlined text-[17px] text-primary-600">dashboard</span>
          <span>Dashboard</span>
        </button>

        <!-- 2. Patient Intake (Desktop Stepper & Demographic) -->
        <div class="relative dropdown">
          <button onclick="loadScreen('nomination-desktop')" class="nav-trigger flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 hover:text-primary-600 hover:bg-slate-50 transition-colors" id="nav-btn-intake">
            <span class="material-symbols-outlined text-[17px] text-secondary-500">assignment</span>
            <span>Intake</span>
            <span class="material-symbols-outlined text-[14px] text-slate-400">expand_more</span>
          </button>
          <div class="dropdown-menu absolute left-1/2 -translate-x-1/2 top-full mt-1 w-48 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50">
            <a href="javascript:void(0)" onclick="loadScreen('nomination-desktop')" class="nav-item flex items-center gap-2 px-3 py-2 text-slate-700 hover:bg-primary-50 hover:text-primary-600 transition-colors rounded-lg mx-1" data-screen-id="nomination-desktop">
              <span class="material-symbols-outlined text-base text-secondary-500">clinical_notes</span>
              <span class="font-medium text-xs">Nomination Stepper</span>
            </a>
            <a href="javascript:void(0)" onclick="loadScreen('demographic-desktop')" class="nav-item flex items-center gap-2 px-3 py-2 text-slate-700 hover:bg-primary-50 hover:text-primary-600 transition-colors rounded-lg mx-1" data-screen-id="demographic-desktop">
              <span class="material-symbols-outlined text-base text-slate-400">badge</span>
              <span class="font-medium text-xs">Demographic Intake</span>
            </a>
          </div>
        </div>

        <!-- 3. Clinical Record (Direct Link) -->
        <button onclick="loadScreen('record')" class="nav-trigger nav-direct flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 hover:text-primary-600 hover:bg-slate-50 transition-colors" id="nav-btn-record" data-screen-id="record">
          <span class="material-symbols-outlined text-[17px] text-teal-600">health_and_safety</span>
          <span>Clinical Record</span>
        </button>

        <!-- 4. Clinical Logo (Direct Link) -->
        <button onclick="loadScreen('logo')" class="nav-trigger nav-direct flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 hover:text-primary-600 hover:bg-slate-50 transition-colors" id="nav-btn-brand" data-screen-id="logo">
          <span class="material-symbols-outlined text-[17px] text-purple-600">palette</span>
          <span>Clinical Logo</span>
        </button>
      </nav>

      <!-- Right Header Status (Right) -->
      <div class="hidden lg:flex items-center gap-2 shrink-0">
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-50 border border-slate-200 text-[11px] text-slate-600 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Live EHR Synced</span>
        </div>
      </div>

    </div>

    <!-- SUB-BAR / VIEWER CONTROL BAR -->
    <div id="viewer-subbar" class="bg-slate-50/90 border-t border-slate-200/80 px-4 sm:px-6 py-1.5 flex items-center justify-between text-xs">
      
      <!-- Current Page Label -->
      <div class="flex items-center gap-2 truncate">
        <span class="text-slate-400 font-medium hidden sm:inline" id="current-category">Dashboards</span>
        <span class="text-slate-300 hidden sm:inline">/</span>
        <span class="font-semibold text-slate-900 truncate" id="current-title">Doctor Dashboard (Desktop Workstation)</span>
        <span class="hidden md:inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-100/80 text-blue-700" id="current-badge">Desktop</span>
      </div>

    </div>
  </header>

  <!-- MAIN VIEWER CONTAINER -->
  <main class="flex-1 w-full relative flex flex-col items-center justify-center overflow-hidden" id="viewer-container">
    
    <!-- IFRAME FOR LIVE / SCREENSHOT VIEW -->
    <div id="frame-wrapper" class="w-full h-full flex items-center justify-center transition-all duration-300 ease-out bg-slate-100">
      <iframe id="main-frame" src="screens/medlens_doctor_dashboard_clinical_triage_desktop.html" class="w-full h-full border-0 bg-white transition-all duration-300" title="MedLens Active Screen"></iframe>
    </div>

    <!-- DIRECTORY / ALL PAGES OVERVIEW (Hidden by default) -->
    <div id="directory-view" class="hidden absolute inset-0 bg-white z-40 overflow-y-auto p-6 sm:p-10">
      <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex items-center justify-between border-b border-slate-200 pb-4">
          <div>
            <h2 class="font-heading font-bold text-xl text-slate-900">All Navigation Pages</h2>
            <p class="text-xs text-slate-500 mt-0.5">Direct index of all screens, design assets, and architecture documents.</p>
          </div>
          <button onclick="toggleDirectoryView()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">close</span>
            <span>Close Overview</span>
          </button>
        </div>

        <div class="overflow-hidden border border-slate-200 rounded-xl shadow-sm">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider font-semibold">
              <tr>
                <th class="px-4 py-3">Page / Screen</th>
                <th class="px-4 py-3">Category</th>
                <th class="px-4 py-3">Format</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200" id="directory-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Screen Registry
    const SCREENS = {
      'dashboard-desktop': {
        title: 'Doctor Dashboard (Clinical Triage)',
        category: 'Dashboards',
        badge: 'Desktop',
        html: 'screens/medlens_doctor_dashboard_clinical_triage_desktop.html',
        screenshot: 'screenshots/medlens_doctor_dashboard_clinical_triage_desktop.png',
        defaultVp: '100%'
      },
      'dashboard-mobile': {
        title: 'Doctor Dashboard (Clinical Triage)',
        category: 'Dashboards',
        badge: 'Mobile',
        html: 'screens/medlens_doctor_dashboard_clinical_triage.html',
        screenshot: 'screenshots/medlens_doctor_dashboard_clinical_triage.png',
        defaultVp: '390px'
      },
      'demographic-desktop': {
        title: 'Patient Demographic Intake',
        category: 'Intake',
        badge: 'Desktop',
        html: 'screens/medlens_patient_basic_details_demographic_intake_desktop.html',
        screenshot: 'screenshots/medlens_patient_basic_details_demographic_intake_desktop.png',
        defaultVp: '100%'
      },
      'nomination-desktop': {
        title: 'Patient Nomination Intake',
        category: 'Intake',
        badge: 'Desktop',
        html: 'screens/medlens_patient_nomination_intake_desktop.html',
        screenshot: 'screenshots/medlens_patient_nomination_intake_desktop.png',
        defaultVp: '100%'
      },
      'intake': {
        title: 'Patient Nomination Intake (Step 1)',
        category: 'Intake',
        badge: 'Desktop',
        html: 'screens/medlens_patient_nomination_intake_desktop.html',
        screenshot: 'screenshots/medlens_patient_nomination_intake_desktop.png',
        defaultVp: '100%'
      },
      'nomination-mobile': {
        title: 'Patient Nomination Intake',
        category: 'Intake',
        badge: 'Mobile',
        html: 'screens/medlens_patient_nomination_intake.html',
        screenshot: 'screenshots/medlens_patient_nomination_intake.png',
        defaultVp: '390px'
      },
      'record': {
        title: 'Structured Clinical Record',
        category: 'Clinical Core',
        badge: 'Desktop',
        html: 'screens/medlens_patient_details_structured_clinical_record.html',
        screenshot: 'screenshots/medlens_patient_details_structured_clinical_record.png',
        defaultVp: '100%'
      },
      'logo': {
        title: 'MedLens Clinical Logo & Identity',
        category: 'Brand',
        badge: 'Component',
        html: 'screens/medlens_clinical_logo.html',
        screenshot: 'screenshots/medlens_clinical_logo.png',
        defaultVp: '100%'
      },
      'headshot': {
        title: 'Physician Headshot (Dr. Sarah Jenkins)',
        category: 'Brand',
        badge: 'Asset PNG',
        html: 'screenshots/close_up_friendly_professional_headshot_of_a_female_physician_wearing_a_white.png',
        screenshot: 'screenshots/close_up_friendly_professional_headshot_of_a_female_physician_wearing_a_white.png',
        defaultVp: '100%'
      },
      'prd': {
        title: 'Product Requirements Document (PRD)',
        category: 'Docs',
        badge: 'Markdown',
        html: 'docs/medlens_product_requirements_document_prd.md',
        screenshot: null,
        defaultVp: '100%'
      },
      'architecture': {
        title: 'System Architecture Specification',
        category: 'Docs',
        badge: 'Spec TXT',
        html: 'docs/medlens_system_architecture_specification.txt',
        screenshot: null,
        defaultVp: '100%'
      },
      'design': {
        title: 'Design System & Color Tokens',
        category: 'Docs',
        badge: 'Tokens MD',
        html: 'docs/clinical_clarity_care_design.md',
        screenshot: null,
        defaultVp: '100%'
      }
    };

    let currentScreenId = 'dashboard-desktop';
    let currentRenderMode = 'live'; // 'live' or 'screenshot'
    let currentViewport = '100%';
    let isDirectoryOpen = false;

    function loadScreen(id) {
      if (!SCREENS[id]) return;
      currentScreenId = id;
      const screen = SCREENS[id];

      // Close directory view if open
      if (isDirectoryOpen) toggleDirectoryView(false);

      // Update Subbar Labels
      document.getElementById('current-category').textContent = screen.category;
      document.getElementById('current-title').textContent = screen.title;
      document.getElementById('current-badge').textContent = screen.badge;

      // Update Navigation Active State
      const topCategoryMap = {
        'nav-btn-dashboards': ['dashboard-desktop'],
        'nav-btn-intake': ['demographic-desktop', 'nomination-desktop', 'intake'],
        'nav-btn-record': ['record'],
        'nav-btn-brand': ['logo']
      };

      for (const [btnId, screenIds] of Object.entries(topCategoryMap)) {
        const btn = document.getElementById(btnId);
        if (btn) {
          if (screenIds.includes(id)) {
            btn.classList.add('bg-primary-50', 'text-primary-700', 'font-semibold');
            btn.classList.remove('text-slate-600');
          } else {
            btn.classList.remove('bg-primary-50', 'text-primary-700', 'font-semibold');
            btn.classList.add('text-slate-600');
          }
        }
      }

      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.getAttribute('data-screen-id') === id) {
          el.classList.add('bg-primary-50', 'text-primary-700', 'font-semibold');
        } else {
          el.classList.remove('bg-primary-50', 'text-primary-700', 'font-semibold');
        }
      });

      // Hide or show screenshot toggle if not available (e.g. docs)
      const renderToggle = document.getElementById('render-mode-toggle');
      if (renderToggle) {
        if (!screen.screenshot) {
          renderToggle.style.display = 'none';
          currentRenderMode = 'live';
        } else {
          renderToggle.style.display = 'flex';
        }
      }

      // Auto-set viewport for mobile screens
      if (screen.defaultVp === '390px') {
        setViewport('390px');
      } else {
        setViewport('100%');
      }

      // Update iframe source & external button
      updateFrame();

      // Update URL hash
      window.location.hash = id;
    }

    function updateFrame() {
      const screen = SCREENS[currentScreenId];
      const targetUrl = (currentRenderMode === 'screenshot' && screen.screenshot) 
        ? screen.screenshot 
        : screen.html;

      const mainFrame = document.getElementById('main-frame');
      if (mainFrame) mainFrame.src = targetUrl;
      const extBtn = document.getElementById('open-external-btn');
      if (extBtn) extBtn.href = targetUrl;

      // Update live/screenshot button active styles
      const btnLive = document.getElementById('btn-mode-live');
      const btnScreen = document.getElementById('btn-mode-screenshot');
      if (btnLive && btnScreen) {
        if (currentRenderMode === 'live') {
          btnLive.className = 'px-2 py-0.5 rounded-md text-[11px] font-semibold bg-white text-primary-600 shadow-sm transition-all flex items-center gap-1';
          btnScreen.className = 'px-2 py-0.5 rounded-md text-[11px] font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1';
        } else {
          btnScreen.className = 'px-2 py-0.5 rounded-md text-[11px] font-semibold bg-white text-primary-600 shadow-sm transition-all flex items-center gap-1';
          btnLive.className = 'px-2 py-0.5 rounded-md text-[11px] font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1';
        }
      }
    }

    function setRenderMode(mode) {
      currentRenderMode = mode;
      updateFrame();
    }

    function setViewport(width) {
      currentViewport = width;
      const frame = document.getElementById('main-frame');
      const wrapper = document.getElementById('frame-wrapper');

      const btnDesktop = document.getElementById('btn-vp-desktop');
      const btnTablet = document.getElementById('btn-vp-tablet');
      const btnMobile = document.getElementById('btn-vp-mobile');

      // Reset button styles
      [btnDesktop, btnTablet, btnMobile].forEach(btn => {
        if (btn) btn.className = 'p-1 rounded-md text-slate-500 hover:text-slate-900 transition-all';
      });

      if (width === '100%') {
        if (btnDesktop) btnDesktop.className = 'p-1 rounded-md text-primary-600 bg-white shadow-sm transition-all';
        if (frame) {
          frame.style.width = '100%';
          frame.style.maxWidth = '100%';
          frame.style.height = '100%';
          frame.style.borderRadius = '0px';
          frame.style.boxShadow = 'none';
        }
        if (wrapper) wrapper.classList.remove('p-4');
      } else if (width === '768px') {
        if (btnTablet) btnTablet.className = 'p-1 rounded-md text-primary-600 bg-white shadow-sm transition-all';
        if (frame) {
          frame.style.width = '768px';
          frame.style.maxWidth = '768px';
          frame.style.height = 'calc(100% - 32px)';
          frame.style.borderRadius = '16px';
          frame.style.boxShadow = '0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1)';
        }
        if (wrapper) wrapper.classList.add('p-4');
      } else if (width === '390px') {
        if (btnMobile) btnMobile.className = 'p-1 rounded-md text-primary-600 bg-white shadow-sm transition-all';
        if (frame) {
          frame.style.width = '390px';
          frame.style.maxWidth = '390px';
          frame.style.height = 'calc(100% - 32px)';
          frame.style.borderRadius = '32px';
          frame.style.boxShadow = '0 20px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.1)';
        }
        if (wrapper) wrapper.classList.add('p-4');
      }
    }

    function toggleDirectoryView(forceState) {
      isDirectoryOpen = forceState !== undefined ? forceState : !isDirectoryOpen;
      const dirView = document.getElementById('directory-view');
      const dirBtn = document.getElementById('nav-btn-directory');

      if (isDirectoryOpen) {
        dirView.classList.remove('hidden');
        dirBtn.classList.add('bg-slate-200', 'text-slate-900');
        renderDirectoryTable();
      } else {
        dirView.classList.add('hidden');
        dirBtn.classList.remove('bg-slate-200', 'text-slate-900');
      }
    }

    function renderDirectoryTable() {
      const tbody = document.getElementById('directory-table-body');
      tbody.innerHTML = '';

      Object.keys(SCREENS).forEach(key => {
        const item = SCREENS[key];
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-3 font-medium text-slate-900">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-base text-slate-400">
                ${item.badge === 'Mobile' ? 'smartphone' : (item.badge === 'Desktop' ? 'desktop_windows' : 'article')}
              </span>
              <span>${item.title}</span>
            </div>
          </td>
          <td class="px-4 py-3 text-slate-500">${item.category}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${
              item.badge === 'Desktop' ? 'bg-blue-50 text-blue-700' :
              (item.badge === 'Mobile' ? 'bg-emerald-50 text-emerald-700' : 'bg-purple-50 text-purple-700')
            }">${item.badge}</span>
          </td>
          <td class="px-4 py-3 text-right">
            <div class="inline-flex items-center gap-1.5">
              <button onclick="loadScreen('${key}')" class="px-2.5 py-1 rounded-md bg-primary-50 text-primary-600 hover:bg-primary-100 font-semibold transition-colors">
                View in Shell
              </button>
              <a href="${item.html}" target="_blank" class="p-1 text-slate-400 hover:text-slate-700 transition-colors" title="Open in New Tab">
                <span class="material-symbols-outlined text-[15px]">open_in_new</span>
              </a>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    
    // Synchronize navbar when user navigates inside iframe
    const mainFrame = document.getElementById('main-frame');
    mainFrame.addEventListener('load', () => {
      try {
        const frameLoc = mainFrame.contentWindow.location;
        const path = frameLoc.pathname;
        const filename = path.substring(path.lastIndexOf('/') + 1);

        for (const key in SCREENS) {
          if (SCREENS[key].html.endsWith(filename)) {
            if (currentScreenId !== key) {
              currentScreenId = key;
              const screen = SCREENS[key];
              const catEl = document.getElementById('current-category');
              if (catEl) catEl.textContent = screen.category;
              const titleEl = document.getElementById('current-title');
              if (titleEl) titleEl.textContent = screen.title;
              const badgeEl = document.getElementById('current-badge');
              if (badgeEl) badgeEl.textContent = screen.badge;
              const extBtn = document.getElementById('open-external-btn');
              if (extBtn) extBtn.href = screen.html;

              const topCategoryMap = {
                'nav-btn-dashboards': ['dashboard-desktop'],
                'nav-btn-intake': ['demographic-desktop', 'nomination-desktop', 'intake'],
                'nav-btn-record': ['record'],
                'nav-btn-brand': ['logo']
              };

              for (const [btnId, screenIds] of Object.entries(topCategoryMap)) {
                const btn = document.getElementById(btnId);
                if (btn) {
                  if (screenIds.includes(key)) {
                    btn.classList.add('bg-primary-50', 'text-primary-700', 'font-semibold');
                    btn.classList.remove('text-slate-600');
                  } else {
                    btn.classList.remove('bg-primary-50', 'text-primary-700', 'font-semibold');
                    btn.classList.add('text-slate-600');
                  }
                }
              }

              document.querySelectorAll('.nav-item').forEach(el => {
                if (el.getAttribute('data-screen-id') === key) {
                  el.classList.add('bg-primary-50', 'text-primary-700', 'font-semibold');
                } else {
                  el.classList.remove('bg-primary-50', 'text-primary-700', 'font-semibold');
                }
              });

              window.location.hash = key;
            }
            break;
          }
        }
      } catch (err) {
        // Handled silently
      }
    });

    // Initialize from URL Hash or default

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && SCREENS[hash]) {
        loadScreen(hash);
      } else {
        loadScreen('dashboard-desktop');
      }
    });
  </script>
</body>
</html>
